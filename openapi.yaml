        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/calls/originate:
    post:
      tags: [Calls]
      summary: Originate a new call
      operationId: originateCall
      parameters:
        - $ref: "#/components/parameters/XAllowedContexts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginateRequest"
      description: >
        Runs `originate` synchronously on its own ESL connection, so the reply
        is always this request's. Blocks until the A-leg answers or the
        originate times out (`timeout_sec`, default 60 s). At most 20
        originates run at once per server; more are refused with 503.
      responses:
        "200":
          description: Call originated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginateResponse"
        "400":
          description: >
            Invalid request: missing `aleg`, `timeout_sec` above 85, a field
            that could set inline variables or shift the originate arguments
            (see `aleg`, `bleg`, `dialplan`, `context`, caller ID), a timing
            variable in `channel_variables`, or FreeSWITCH rejected the
            originate arguments (`-USAGE`; message
            `Invalid originate arguments: -USAGE: …`).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            FreeSWITCH could not place the call: a call outcome such as
            `USER_BUSY`, `NO_ANSWER`, `CALL_REJECTED` or
            `USER_NOT_REGISTERED`. The message is `Call not placed: <cause>`.
            Nothing is tracked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                status: error
                message: "Call not placed: USER_BUSY"
        "502":
          description: >
            ESL transport failure (connect, authentication, connection lost,
            timeout) or a reply that is neither `+OK`, `-ERR` nor `-USAGE`. Nothing is
            tracked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: >
            Too many originates already in flight on this server (20 at a
            time). Refused at once, without queueing and without contacting
            FreeSWITCH; retry after the `Retry-After` delay.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                status: error
                message: "Too many calls being originated; retry shortly"

