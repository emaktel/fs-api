openapi: 3.0.3
info:
  title: FreeSWITCH Call Control API
  description: |
    RESTful API for controlling FreeSWITCH calls and managing mod_callcenter
    resources (queues, agents, tiers, members) via Event Socket Library (ESL).

    ## Authentication

    When `FSAPI_AUTH_TOKENS` is configured, all requests (except from localhost)
    must include a valid Bearer token in the `Authorization` header.

    ## Multi-Tenant Authorization

    The `X-Allowed-Contexts` header enables per-tenant access control:
    - **Omitted or empty** — unrestricted access (backward compatible)
    - **`*`** — explicit unrestricted / super-admin access
    - **`domain1.com,domain2.com`** — restrict to listed domains

    For call endpoints the domain is matched against the call's `accountcode`.
    For callcenter endpoints it is matched against the domain portion of
    queue/tier names (`name@domain`) or the `domain_name=` value inside agent
    contact strings.
  version: 0.4.2
  contact:
    name: Emaktel
    url: https://github.com/emaktel/fs-api

servers:
  - url: http://localhost:37274
    description: Local development

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Required for remote requests when FSAPI_AUTH_TOKENS is configured.
        Localhost requests bypass authentication.

  # -------------------------------------------------------------------------
  # Headers
  # -------------------------------------------------------------------------
  parameters:
    XAllowedContexts:
      name: X-Allowed-Contexts
      in: header
      required: false
      description: >
        Comma-separated list of allowed FreeSWITCH contexts (domains).
        Use `*` for unrestricted access. Omit for backward-compatible
        unrestricted access.
      schema:
        type: string
        example: "customer1.example.com,customer2.example.com"
    XAllowedContextsRequired:
      name: X-Allowed-Contexts
      in: header
      required: true
      description: >
        Comma-separated list of allowed contexts. Required for this endpoint.
        Use `*` for unrestricted access.
      schema:
        type: string
        example: "*"
    CallUUID:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Call leg UUID
    QueueName:
      name: queue_name
      in: path
      required: true
      schema:
        type: string
      description: "Queue name in `name@domain` format"
      example: "support@customer1.example.com"
    AgentName:
      name: agent_name
      in: path
      required: true
      schema:
        type: string
      description: Agent identifier (UUID)
      example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"

  # -------------------------------------------------------------------------
  # Reusable response headers
  # -------------------------------------------------------------------------
  headers:
    X-Request-ID:
      description: Unique identifier for the request, useful for log correlation
      schema:
        type: string
        format: uuid

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    SuccessMessage:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
      required: [status, message]

    ErrorMessage:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
      required: [status, message]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        version:
          type: string
        error:
          type: string
      required: [status, version]

    RegistrationRow:
      type: object
      description: SIP registration entry from FreeSWITCH `show registrations`
      properties:
        reg_user:
          type: string
          description: Registered SIP username
        realm:
          type: string
          description: SIP domain / realm (used for context-based filtering)
        token:
          type: string
        url:
          type: string
          description: Full Sofia SIP contact URL
        expires:
          type: string
          description: Unix timestamp when the registration expires
        network_ip:
          type: string
          description: Public IP address of the endpoint
        network_port:
          type: string
        network_proto:
          type: string
          enum: [udp, tcp, tls]
        hostname:
          type: string
          description: FreeSWITCH node hostname
        metadata:
          type: string
      additionalProperties: true

    ListRegistrationsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        row_count:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationRow"
      required: [status, row_count, rows]

    CountRegistrationsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
      required: [status, count]

    CallRow:
      type: object
      additionalProperties:
        type: string
      description: >
        Call summary row from FreeSWITCH `show calls`, enriched with fields
        that only appear in `show channels`. A-leg channel fields are merged
        as-is; B-leg channel fields are prefixed with `b_` to match the
        existing `show calls` convention. Enriched fields: `application`,
        `application_data`, `dialplan`, `context`, `read_codec`, `read_rate`,
        `read_bit_rate`, `write_codec`, `write_rate`, `write_bit_rate`,
        `secure`, `initial_cid_name`, `initial_cid_num`, `initial_ip_addr`,
        `initial_dest`, `initial_dialplan`, `initial_context` (and their
        `b_`-prefixed B-leg counterparts when a B-leg exists). Fields are
        omitted for legs whose channel row is not currently in the channels
        table.

    ListCallsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        row_count:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CallRow"
      required: [status, row_count, rows]

    CallDetailsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        call_info:
          type: object
          additionalProperties: true
          description: >
            Same enriched shape as `CallRow`: a `show calls` row merged with
            channel-only fields from `show channels` (A-leg as-is, B-leg
            fields prefixed with `b_`).
        aleg:
          type: object
          properties:
            uuid:
              type: string
            details:
              type: object
              additionalProperties: true
        bleg:
          type: object
          properties:
            uuid:
              type: string
            details:
              type: object
              additionalProperties: true
      required: [status, call_info, aleg]

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          additionalProperties: true
      required: [status, data]

    OriginateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            response:
              type: string
              description: >
                UUID of the A-leg that answered, from FreeSWITCH's `+OK <uuid>`.
                For a forked A-leg (`user/<ext>@<domain>` rings every
                registration) it is the leg that picked up. The call is tracked
                for `call_event` broadcasts only when this is a canonical
                lowercase UUID.
      required: [status, data]

    # -- Callcenter schemas ------------------------------------------------

    CCListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        row_count:
          type: integer
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
      required: [status, row_count, rows]

    CCCountResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
      required: [status, count]

    # -- Request bodies ----------------------------------------------------

    # Every value below is matched against its shape and anything else is
    # refused with 400 before a FreeSWITCH command is built (input_allowlist.go,
    # originate_input.go). Names, contexts and contacts in another tenant than
    # X-Allowed-Contexts allows answer 403.

    HangupRequest:
      type: object
      properties:
        cause:
          type: string
          pattern: "^(?:[A-Z][A-Z_]{0,63}|[0-9]{1,3})$"
          description: "Hangup cause name or Q.850 code (default: NORMAL_CLEARING)"
          example: NORMAL_CLEARING

    TransferRequest:
      type: object
      required: [destination]
      properties:
        destination:
          type: string
          pattern: "^[A-Za-z0-9*#+][A-Za-z0-9*#+_.-]{0,63}$"
          description: Dialplan extension, number or feature code
        leg:
          type: string
          enum: [aleg, bleg, both]
          default: aleg
        dialplan:
          type: string
          enum: [XML]
          description: "Only with context (defaults to XML when context is set)"
        context:
          type: string
          description: A domain name in X-Allowed-Contexts (403 otherwise)

    ConferenceRequest:
      type: object
      required: [destination]
      properties:
        destination:
          type: string
          pattern: "^[0-9+*#]{1,20}$"
          description: Extension or external number to add to the call's conference room
        tollAllow:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,32}(?:,[A-Za-z0-9_-]{1,32}){0,31}$"
          description: >
            The originating extension's toll classes, read server-side by the caller (the
            SvelteKit softphone reads them from the user's own extension; the public calls_v2
            proxy never forwards one), so the loopback dial is gated by the same dialplan toll
            rules a normal outbound call gets. Empty for internal-extension adds.

    BridgeRequest:
      type: object
      required: [uuid_a, uuid_b]
      properties:
        uuid_a:
          type: string
          format: uuid
          description: Canonical lowercase uuid
        uuid_b:
          type: string
          format: uuid
          description: Canonical lowercase uuid

    HoldRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [hold, unhold]

    RecordRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop]
        filename:
          type: string
          description: >
            Required for start: a .wav or .mp3 file under
            /var/lib/freeswitch/recordings/<the call's domain>/, path segments of letters,
            digits, `_`, `-` and `.` (no `..`).

    DTMFRequest:
      type: object
      required: [digits]
      properties:
        digits:
          type: string
          pattern: "^[0-9A-Da-d*#wW]{1,64}$"
        duration:
          type: integer
          minimum: 40
          maximum: 2000
          description: "Tone duration in ms (default: 100)"

    OriginateRequest:
      type: object
      required: [aleg]
      properties:
        aleg:
          type: string
          description: >
            One `user/<extension>@<domain>`, the domain in X-Allowed-Contexts (403 otherwise).
        bleg:
          type: string
          description: >
            `&park()` (the default), or a dialplan extension, number or feature code the
            answered A-leg is sent to in `context` (required then).
        dialplan:
          type: string
          enum: [XML]
        context:
          type: string
          description: A domain name in X-Allowed-Contexts (403 otherwise).
        caller_id_name:
          type: string
          description: >
            Letters, digits, spaces and `. , ' _ ( ) # + -`, at most 64 characters.
            Spaces, apostrophes and commas are escaped so FreeSWITCH receives the
            name exactly (leading and trailing spaces are trimmed).
        caller_id_number:
          type: string
          pattern: "^\\+?[0-9]{1,20}$"
        timeout_sec:
          type: integer
          maximum: 85
          example: 30
          description: >
            Ring timeout in seconds (default 60). At most 85, so the reply
            always arrives within the server's response timeout; above that
            the request is refused with 400.
        channel_variables:
          type: object
          description: Only `origination_uuid`, a canonical lowercase uuid.
          properties:
            origination_uuid:
              type: string
              format: uuid
          additionalProperties: false
        callback_url:
          type: string
          description: Not accepted (400).

    AgentAddRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: >
            The FusionPBX agent uuid, or `<name>@<domain>` with the domain in
            X-Allowed-Contexts. A uuid-named agent added by a restricted caller (exactly one
            allowed context, 400 otherwise) belongs to that tenant until its contact is set
            (remembered per box, in memory, for 10 minutes): only that tenant may change it or
            give it a contact, in that tenant.
        type:
          type: string
          enum: [callback, uuid-standby]

    AgentSetRequest:
      type: object
      required: [key, value]
      description: >
        The agent must belong to one of X-Allowed-Contexts (its contact's domain_name, its
        user/<ext>@<domain> contact, or its <name>@<domain> name): 403 otherwise, 404 when
        it isn't loaded. An agent with no tenant yet can only be given a contact in one of
        X-Allowed-Contexts.
      properties:
        key:
          type: string
          enum:
            - status
            - state
            - contact
            - type
            - max_no_answer
            - wrap_up_time
            - reject_delay_time
            - busy_delay_time
            - no_answer_delay_time
            - ready_time
        value:
          type: string
          description: >
            status: Available, Available (On Demand), On Break or Logged Out. state: Idle,
            Waiting, Receiving, In a queue call or Reserved. type: callback or uuid-standby.
            contact: user/<extension>@<domain>, the domain in X-Allowed-Contexts. ready_time:
            epoch seconds. The other keys: a whole number (at most 6 digits).

    TierAddRequest:
      type: object
      required: [queue, agent]
      properties:
        queue:
          type: string
          description: "Queue name `<name>@<domain>`, the domain in X-Allowed-Contexts"
        agent:
          type: string
          description: An agent of one of X-Allowed-Contexts (uuid or `<name>@<domain>`)
        level:
          type: string
          pattern: "^[0-9]{1,6}$"
        position:
          type: string
          pattern: "^[0-9]{1,6}$"
          description: Only with level

    TierDelRequest:
      type: object
      required: [queue, agent]
      properties:
        queue:
          type: string
        agent:
          type: string

    TierSetRequest:
      type: object
      required: [queue, agent, key, value]
      properties:
        queue:
          type: string
        agent:
          type: string
        key:
          type: string
          enum: [state, level, position]
        value:
          type: string
          description: "state: Ready, Standby, Offering, Active Inbound or No Answer. level, position: a whole number."

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: Domain / context not in allowed list
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    BadGateway:
      description: FreeSWITCH ESL command error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    ServiceUnavailable:
      description: FreeSWITCH ESL connection unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"

# ===========================================================================
# Paths
# ===========================================================================
paths:
  # -------------------------------------------------------------------------
  # Health
  # -------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Tests ESL connectivity and returns service health status.
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: ESL connection unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # -------------------------------------------------------------------------
  # Status
  # -------------------------------------------------------------------------
  /v1/status:
    get:
      tags: [Status]
      summary: Get FreeSWITCH status
      operationId: getStatus
      parameters:
        - $ref: "#/components/parameters/XAllowedContexts"
      responses:
        "200":
          description: FreeSWITCH status retrieved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -------------------------------------------------------------------------
  # Registrations
  # -------------------------------------------------------------------------
  /v1/registrations:
    get:
      tags: [Registrations]
      summary: List SIP registrations
      description: >
        Returns active SIP registrations. The `X-Allowed-Contexts` header is
        **required**. When access is restricted the list is filtered to
        registrations whose `realm` field matches an allowed context.
      operationId: listRegistrations
      parameters:
        - $ref: "#/components/parameters/XAllowedContextsRequired"
      responses:
        "200":
          description: Registrations retrieved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRegistrationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/registrations/count:
    get:
      tags: [Registrations]
      summary: Count SIP registrations
      description: >
        Returns the number of active SIP registrations visible to the caller.
        The `X-Allowed-Contexts` header is **required**. Unrestricted access
        returns the total count directly; restricted access counts only
        registrations whose `realm` matches an allowed context.
      operationId: countRegistrations
      parameters:
        - $ref: "#/components/parameters/XAllowedContextsRequired"
      responses:
        "200":
          description: Registration count
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountRegistrationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -------------------------------------------------------------------------
  # Calls
  # -------------------------------------------------------------------------
  /v1/calls:
    get:
      tags: [Calls]
      summary: List all active calls
      description: >
        Returns active calls filtered by allowed contexts.
        The X-Allowed-Contexts header is **required** for this endpoint.
      operationId: listCalls
      parameters:
        - $ref: "#/components/parameters/XAllowedContextsRequired"
      responses:
        "200":
          description: Calls retrieved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCallsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/calls/{uuid}:
    get:
      tags: [Calls]
      summary: Get call details
      description: >
        Retrieves full A-leg and B-leg channel details for a call.
        You may query by either leg's UUID.
      operationId: getCallDetails
      parameters:
        - $ref: "#/components/parameters/CallUUID"
        - $ref: "#/components/parameters/XAllowedContexts"
      responses:
        "200":
          description: Call details retrieved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/calls/{uuid}/hangup:
    post:
      tags: [Calls]
      summary: Hangup a call
      operationId: hangupCall
      parameters:
        - $ref: "#/components/parameters/CallUUID"
        - $ref: "#/components/parameters/XAllowedContexts"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HangupRequest"
      responses:
        "200":
          description: Call hung up
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/calls/{uuid}/transfer:
    post:
      tags: [Calls]
      summary: Transfer a call
      operationId: transferCall
      parameters:
        - $ref: "#/components/parameters/CallUUID"
        - $ref: "#/components/parameters/XAllowedContexts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Call transferred
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/calls/{uuid}/conference:
    post:
      tags: [Calls]
      summary: Add a participant to the call as a server-mixed conference ("add people")
      description: >
        On the first add, moves the call and its bridged partner (read from the call's own
        channel dump; it must be the same tenant, 403 otherwise, 409 if it has hung up) into a
        per-call room `sp-<uuid>` on the `softphone` conference profile, one `uuid_transfer` per
        leg, then dials `destination` into it via a loopback through the call's own dialplan
        context; later adds reuse the room. A call in any other conference answers 409. The join
        is verified and a 503 is returned if the profile is unavailable. The dial is
        non-blocking — a 200 means the participant was queued, not yet connected.
      operationId: addToConference
      parameters:
        - $ref: "#/components/parameters/CallUUID"
        - $ref: "#/components/parameters/XAllowedContexts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConferenceRequest"
      responses:
        "200":
          description: Participant queued into the conference
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The bridged partner has hung up, or the call is in a conference fs-api didn't start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/calls/bridge:
    post:
      tags: [Calls]
      summary: Bridge two calls
      operationId: bridgeCalls
      parameters:
        - $ref: "#/components/parameters/XAllowedContexts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeRequest"
      responses:
        "200":
          description: Calls bridged
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
